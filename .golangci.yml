# Один набір лінтерів на всі Go-сервіси Kite. Формат конфігу — golangci-lint v2.
version: "2"

run:
  timeout: 5m

linters:
  # errcheck, govet, ineffassign, staticcheck і unused у v2 увімкнені типово,
  # тож тут лише те, що додається поверх.
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - whitespace

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - importShadow
        - unnamedResult
    misspell:
      locale: US
    revive:
      rules:
        - name: exported

  exclusions:
    rules:
      # У тестах ігнорувати помилку закриття або «негарний» виклик — нормально.
      - path: _test\.go
        linters:
          - errcheck
          - gocritic

# У v2 форматування — окрема секція: `golangci-lint fmt` виправляє, `run` лає.
formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
